    <li>
        <a href="{{ item[1].url }}" title="{{ item[1].title }}">{{ item[1].title }}</a>

{% endfor %}
<li class="language-switch"><a href="{% if page.lang == 'pt' %}/index-en.html{% else %}/{% endif %}">{% if page.lang == 'pt' %}EN{% else %}PT{% endif %}</a></li>
