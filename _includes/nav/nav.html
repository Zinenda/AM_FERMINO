{% if page.lang == "en" %}
    {% assign home_url = "/index-en.html" %}
{% else %}
    {% assign home_url = "/" %}
{% endif %}
{% for item in site.data.nav[page.lang] %}
    <li>
        <a href="{{ home_url | append: item[1].url | relative_url }}" title="{{ item[1].title }}">{{ item[1].title }}</a>
    </li>
{% endfor %}
