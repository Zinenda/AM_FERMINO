<dialog class="photo-viewer" id="photo-viewer" aria-label="{% if page.lang == 'pt' %}Visualizador de fotografias{% else %}Photo viewer{% endif %}">
    <div class="photo-viewer-toolbar">
        <button type="button" data-step="-1" aria-label="{% if page.lang == 'pt' %}Fotografia anterior{% else %}Previous photo{% endif %}">‹</button>
        <button type="button" data-step="1" aria-label="{% if page.lang == 'pt' %}Fotografia seguinte{% else %}Next photo{% endif %}">›</button>
        <button type="button" data-close aria-label="{% if page.lang == 'pt' %}Fechar visualizador{% else %}Close photo viewer{% endif %}" autofocus>×</button>
    </div>
    <figure>
        <img alt="">
        <figcaption aria-live="polite"></figcaption>
    </figure>
</dialog>
<script defer src="{{ '/assets/js/photo-viewer.js' | relative_url }}"></script>
