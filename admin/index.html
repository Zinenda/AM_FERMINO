<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173b2d">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel de conteúdos · AM Fermino</title>
    <link rel="icon" href="/assets/img/favicon.png">
    <link href="/admin/config.yml?v=20260921" type="text/yaml" rel="cms-config-url">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef1e9;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(circle at 18% 18%, rgba(166, 207, 74, .2), transparent 28rem),
          linear-gradient(145deg, #f7f8f3 0%, #e7ece2 100%);
      }

      .admin-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        transition: opacity .25s ease, visibility .25s ease;
      }

      .admin-boot[hidden] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .admin-boot__card {
        width: min(28rem, calc(100vw - 3rem));
        padding: 2.5rem;
        border: 1px solid rgba(23, 59, 45, .12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, .88);
        box-shadow: 0 1.5rem 4rem rgba(23, 59, 45, .14);
        text-align: center;
        backdrop-filter: blur(14px);
      }

      .admin-boot img {
        width: 12rem;
        max-width: 70%;
        height: auto;
      }

      .admin-boot p {
        margin: 1.25rem 0 0;
        color: #66736a;
        font-size: .95rem;
      }

      .admin-boot__bar {
        width: 7rem;
        height: .25rem;
        margin: 1.5rem auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: #dce4d7;
      }

      .admin-boot__bar::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #79a83b;
        animation: admin-loading 1.1s ease-in-out infinite alternate;
      }

      @keyframes admin-loading {
        from { transform: translateX(-10%); }
        to { transform: translateX(135%); }
      }
    </style>
  </head>
  <body>
    <div class="admin-boot" id="admin-boot" role="status" aria-live="polite">
      <div class="admin-boot__card">
        <img src="/assets/img/logotipo.svg" alt="AM Fermino Soluções Ambientais">
        <p>A preparar o painel de conteúdos…</p>
        <span class="admin-boot__bar" aria-hidden="true"></span>
      </div>
    </div>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
    <script>
      window.setTimeout(function () {
        var boot = document.getElementById("admin-boot");
        if (boot) boot.hidden = true;
      }, 650);
    </script>
  </body>
</html>
