<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparação — Portfólio opção 1</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #111714; color: #fff; font: 600 15px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    figure { margin: 0; padding: 14px; background: #1b2420; border: 1px solid #344039; }
    figcaption { margin-bottom: 12px; color: #a5c957; text-transform: uppercase; letter-spacing: .08em; }
    img { display: block; width: 100%; height: auto; background: #f4f3ed; }
    @media (max-width: 800px) { body { padding: 16px; } main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Portfólio — opção 1</h1>
  <main>
    <figure><figcaption>Referência seleccionada</figcaption><img src="portfolio-option-1-source.png" alt="Referência visual seleccionada"></figure>
    <figure><figcaption>Implementação local</figcaption><img src="portfolio-option-1-desktop.jpg" alt="Implementação da secção de portfólio"></figure>
  </main>
</body>
</html>
