  <title>Design QA — Drawer de serviços</title>
  <style>

  <main>
    <figure>
      <figcaption>Referência — opção 1</figcaption>

    <figure>
      <figcaption>Implementação — Consultoria Ambiental</figcaption>
      <img src="/output/design-qa/service-drawer-option-1.jpg" alt="Implementação do drawer de serviços">
    </figure>
  </main>
